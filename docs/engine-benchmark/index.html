<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>mahjong-cpp Engine A/B</title><link rel="stylesheet" href="style.css"><main>
<h1>mahjong-cpp Engine A/B</h1><p>同一 request を別々の Web Worker / WASM module へ送ります。初回ロード時間と計算時間は分けて表示します。</p>
<section><h2>局面入力</h2><div class="form"><label>手牌 (mpsz)<input id="hand" value="147m258p369s11122z" spellcheck="false"></label><label>現在巡目<input id="turn" type="number" min="1" max="18" value="6"></label><label>場風<select id="round"><option value="27">東</option><option value="28">南</option></select></label><label>自風<select id="seat"><option value="28">南</option><option value="27">東</option><option value="29">西</option><option value="30">北</option></select></label><label>ドラ表示牌 (mpsz)<input id="dora" value="1z"></label><label>副露 (JSON、任意)<input id="melds" value="[]"></label></div></section>
<section><h2>計算モード</h2><label><input id="mode-standard" name="mode" type="radio" checked> Standard</label><label><input id="mode-advanced" name="mode" type="radio"> Advanced / Custom</label><p class="notice">標準：何切るドリルと同等の設定。期待値・和了率・聴牌率・役別統計・役別Shapley等を計算します。</p><button id="reset-standard" type="button">何切るドリル標準設定に戻す</button><p id="preset-diff"></p></section>
<details id="advanced"><summary>詳細設定（正式key・説明を表示）</summary><div id="advanced-options"></div><p id="capability-note" class="notice"></p></details>
<section class="controls"><label>Engine A<select id="engineA"></select><small id="capA"></small></label><label>Engine B<select id="engineB"></select><small id="capB"></small></label><button id="runA">Engine A 実行</button><button id="runB">Engine B 実行</button><button id="compare">比較実行</button></section>
<p id="status" role="status"></p><section id="result"></section><details id="request-detail"><summary id="show-request">実際に送った request JSON</summary><pre id="request-json"></pre></details>
</main><script type="module" src="app.js?v=BUILD_COMMIT"></script></html>
