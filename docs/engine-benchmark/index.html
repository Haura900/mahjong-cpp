<!doctype html>
<html lang="ja">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>mahjong-cpp Engine A/B</title><link rel="stylesheet" href="style.css">
<main><h1>mahjong-cpp Engine A/B</h1><p>同一 request を別々の Web Worker / WASM module へ送ります。初回ロード時間と計算時間は分けて表示します。</p>
<section class="form"><label>手牌 (mpsz)<input id="hand" value="147m258p369s11122z" spellcheck="false"></label><label>現在巡目<input id="turn" type="number" min="1" max="18" value="6"></label><label>場風<select id="round"><option value="27">東</option><option value="28">南</option></select></label><label>自風<select id="seat"><option value="28">南</option><option value="27">東</option><option value="29">西</option><option value="30">北</option></select></label><label>ドラ表示牌 (mpsz)<input id="dora" value="1z"></label><label>副露 (JSON、任意)<input id="melds" value="[]"></label><label><input id="calls" type="checkbox" checked> 鳴き</label><label><input id="turnYaku" type="checkbox" checked> turn yaku</label><label><input id="deep" type="checkbox" checked> 深探索を自動短縮しない</label></section>
<section class="controls"><label>Engine A<select id="engineA"></select></label><label>Engine B<select id="engineB"></select></label><button id="runA">Engine A 実行</button><button id="runB">Engine B 実行</button><button id="compare">比較実行</button></section>
<p id="status" role="status"></p><section id="result"></section></main><script type="module" src="app.js"></script>
</html>
